services:
  - type: web
    name: gmaps-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SERPAPI_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
